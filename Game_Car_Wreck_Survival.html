<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Wreck - Survival Game</title>
  <style>
    body {
      background: linear-gradient(to right, #e0f7fa, #fce4ec);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      color: #333;
    }

    h1 {
      margin-top: 20px;
      color: #c2185b;
    }

    canvas {
      border: 4px solid #00796b;
      background-color: #f0f0f0;
      margin-top: 20px;
    }

    #info {
      margin-top: 15px;
      font-size: 16px;
      color: #004d40;
    }
  </style>
</head>
<body>

  <h1>🚗 Car Wreck: Survival Game</h1>
  <canvas id="gameCanvas" width="800" height="500"></canvas>
  <div id="info">Use Arrow Keys to control the 🔷 Hero Hex Car</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    class Car {
      constructor(x, y, id) {
        this.x = x;
        this.y = y;
        this.health = 100;
        this.id = id;
        this.vx = Math.random() * 4 - 2;
        this.vy = Math.random() * 4 - 2;
        this.size = 20;
        this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
      }

      draw() {
        if (this.health <= 0) return;
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.fillStyle = "white";
        ctx.font = "12px Arial";
        ctx.fillText(this.id, this.x + 5, this.y + 15);
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width - this.size) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height - this.size) this.vy *= -1;
      }

      checkCollision(other) {
        if (
          this.health > 0 &&
          other.health > 0 &&
          Math.abs(this.x - other.x) < this.size &&
          Math.abs(this.y - other.y) < this.size
        ) {
          this.health -= 10;
          other.health -= 10;
        }
      }
    }

    class HexCar extends Car {
      constructor(x, y, id) {
        super(x, y, id);
        this.vx = 0;
        this.vy = 0;
      }

      draw() {
        if (this.health <= 0) return;
        ctx.fillStyle = "#2196f3";
        const size = 15;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          let angle = Math.PI / 3 * i;
          let px = this.x + size * Math.cos(angle);
          let py = this.y + size * Math.sin(angle);
          ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.fillText(this.id, this.x - 5, this.y + 4);
      }
    }

    // Initialize cars
    const cars = [];
    for (let i = 0; i < 15; i++) {
      cars.push(new Car(Math.random() * 780, Math.random() * 480, i + 1));
    }

    // Replace first car with player-controlled hexagon
    const heroCar = new HexCar(400, 250, "🔷");
    cars[0] = heroCar;

    // Controls
    document.addEventListener("keydown", function (e) {
      const speed = 2;
      if (e.key === "ArrowUp") heroCar.vy = -speed;
      else if (e.key === "ArrowDown") heroCar.vy = speed;
      else if (e.key === "ArrowLeft") heroCar.vx = -speed;
      else if (e.key === "ArrowRight") heroCar.vx = speed;
    });

    document.addEventListener("keyup", function (e) {
      if (["ArrowUp", "ArrowDown"].includes(e.key)) heroCar.vy = 0;
      if (["ArrowLeft", "ArrowRight"].includes(e.key)) heroCar.vx = 0;
    });

    // Game loop
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      cars.forEach(car => car.update());
      for (let i = 0; i < cars.length; i++) {
        for (let j = i + 1; j < cars.length; j++) {
          cars[i].checkCollision(cars[j]);
        }
      }
      cars.forEach(car => car.draw());

      const survivors = cars.filter(car => car.health > 0);
      if (survivors.length === 1) {
        ctx.fillStyle = "#4caf50";
        ctx.font = "28px Arial";
        ctx.fillText(`🏆 Winner: ${survivors[0].id}`, 300, 250);
        return;
      }

      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>
</body>
</html>
